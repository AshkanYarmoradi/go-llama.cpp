---
name: 'GPU tests'

# This job needs a self-hosted CUDA runner. When none is attached, an
# unconditional `pull_request` trigger leaves a queued check on every PR that
# sits there until GitHub cancels it 24 hours later — which is what had been
# happening on every PR since August.
#
# So it is opt-in: run it by hand from the Actions tab, or put the `gpu` label
# on a PR that needs it. Pushes to main and tags still run it, and the job
# times out rather than parking a runner for a day.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - main
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ci-gpu-tests-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ubuntu-latest:
    # On a PR, only when explicitly labelled `gpu`.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'gpu')
    runs-on: self-hosted
    timeout-minutes: 90
    strategy:
      matrix:
        go-version: ['1.25.x']
    steps:
      - name: Clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: 
          submodules: true
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      # You can test your matrix by printing the current Go version
      - name: Display Go version
        run: go version
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y make wget
      - name: Dependencies
        run: |
          # This fixes libc6-dev installations errors on containers...
          sudo rm -rfv /run/systemd/system
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ffmpeg nvidia-cuda-toolkit cmake
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates cmake curl patch
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y pip wget
      - name: Build and test
        run: |
          GPU_TESTS=true BUILD_TYPE=cublas CMAKE_ARGS="-DLLAMA_METAL=OFF -DLLAMA_F16C=OFF -DLLAMA_AVX512=OFF -DLLAMA_AVX2=OFF -DLLAMA_FMA=OFF" \
          make test 2>&1 | tee test_log.log
          if grep -q "using CUDA for GPU acceleration" test_log.log; then
            echo "All good";
          else
            echo "No CUDA found";
            exit 1;
          fi
      - name: Release space from worker ♻
        if: always()
        run: |
          sudo rm -rf build || true
          sudo rm -rf bin || true
          sudo rm -rf dist || true
          sudo rm -rf *.log || true
          make clean || true